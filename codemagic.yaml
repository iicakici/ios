workflows:
  ios-simulator-workflow:
    name: iOS Simulator Test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Create unsigned ipa
        script: |
          mkdir -p build/ios/ipa_manual/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_manual/Payload/
          cd build/ios/ipa_manual
          zip -r ../ipa/app-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa